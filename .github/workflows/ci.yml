name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Needed by the API-types sync check below, which runs the FastAPI app
      # in-process to export its OpenAPI document.
      - uses: astral-sh/setup-uv@v7

      - name: Install Python
        working-directory: apps/api
        run: uv python install 3.12

      - name: Sync Python deps
        working-directory: apps/api
        run: uv sync --frozen

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The client's request/response types are hand-written against FastAPI's
      # Pydantic models. Regenerating here means a schema change that nobody
      # mirrored into lib/api fails the build instead of surfacing at runtime.
      - name: API types are in sync
        working-directory: .
        run: |
          pnpm --filter @stockviz/web gen:api-types
          git diff --exit-code -- apps/web/lib/api/schema.d.ts \
            || { echo "::error::apps/web/lib/api/schema.d.ts is stale — run 'pnpm --filter @stockviz/web gen:api-types' and commit the result."; exit 1; }

      - name: Unit tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7

  api:
    name: api (FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockviz
          POSTGRES_PASSWORD: stockviz_dev
          POSTGRES_DB: stockviz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockviz -d stockviz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lockfile is up to date
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run pyright

      - name: Test
        run: uv run pytest -v --cov=stockviz --cov-report=term-missing --cov-report=xml
        env:
          DATABASE_URL: postgresql+psycopg://stockviz:stockviz_dev@localhost:5432/stockviz

      # Catches a model change that never got a migration. dev previously had
      # two alembic heads and six columns of enum drift; neither was visible
      # until someone deployed.
      - name: Migrations apply and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://stockviz:stockviz_dev@localhost:5432/stockviz

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 7

  security:
    name: security (dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v7

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      # Fails the build on a known high/critical advisory in a runtime dep.
      - name: Audit npm dependencies
        run: pnpm audit --audit-level high --prod

      - name: Install Python
        working-directory: apps/api
        run: uv python install 3.12

      # --no-hashes/--no-deps: pip-audit re-resolves a hashed export in its own
      # venv, which fails on platform-specific wheels. We audit the exact
      # locked set instead. --python 3.12 matches requires-python; the default
      # 3.11 env can't resolve numpy.
      # ecdsa PYSEC-2026-1325 has no fixed release (upstream considers the
      # Minerva timing attack out of scope) and reaches us only through
      # python-jose's ES* algorithms, which the HS256 auth bridge never uses.
      - name: Audit Python dependencies
        working-directory: apps/api
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            --format requirements-txt > requirements.txt
          uvx --python 3.12 pip-audit \
            --requirement requirements.txt \
            --no-deps --strict \
            --ignore-vuln PYSEC-2026-1325

  docker:
    name: docker (api image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile is otherwise only exercised at deploy time on Render,
      # so a broken build surfaced in production rather than on the PR.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockviz
          POSTGRES_PASSWORD: stockviz_dev
          POSTGRES_DB: stockviz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockviz -d stockviz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Shared auth tokens (must match between web and api)
      INTERNAL_API_TOKEN: ci-e2e-token
      AUTH_SECRET: ci-e2e-secret
      NEXTAUTH_JWT_SECRET: ci-e2e-secret
      # Web — uses standard postgres:// driver
      DATABASE_URL: postgres://stockviz:stockviz_dev@localhost:5432/stockviz
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://localhost:8000
      # Scheduler off so it doesn't fire during tests
      ENABLE_SCHEDULER: "false"
      # NextAuth v5 requires explicit host trust in non-production environments
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v7

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Install Python
        working-directory: apps/api
        run: uv python install 3.12

      - name: Sync Python deps
        working-directory: apps/api
        run: uv sync --frozen

      - name: Migrate + seed + backfill
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://stockviz:stockviz_dev@localhost:5432/stockviz
        run: |
          uv run alembic upgrade head
          uv run python -m stockviz.cli seed
          uv run python -m stockviz.cli backfill

      - name: Start API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://stockviz:stockviz_dev@localhost:5432/stockviz
        run: uv run uvicorn stockviz.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for API health check
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done

      - name: Build Next.js
        working-directory: apps/web
        run: pnpm build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
