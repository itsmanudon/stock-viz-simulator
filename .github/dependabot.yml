# Dependency updates.
#
# The repo had no automated dependency updates and no advisory scanning, so a
# vulnerable transitive dep could sit unnoticed indefinitely. The `security`
# job in ci.yml fails on known high/critical advisories; this keeps the
# lockfiles moving so that job rarely has to.
#
# Patch and minor bumps are grouped into one PR per ecosystem per week to keep
# review load sane; majors come through individually because they need a look.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: "/apps/api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    target-branch: dev

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: monthly
    target-branch: dev
