name: stockviz-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockviz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockviz
      POSTGRES_PASSWORD: stockviz_dev
      POSTGRES_DB: stockviz
    ports:
      # 5432 is often taken (native install / other projects). Using 5434
      # to keep the dev DB cleanly isolated.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockviz -d stockviz"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4-standalone
    container_name: stockviz-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula

  kafka:
    image: apache/kafka:3.9.1
    container_name: stockviz-kafka
    profiles: ["events"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: stockviz-kafka-init
    profiles: ["events"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic stockviz.trades.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic stockviz.market.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic stockviz.news.v1 --partitions 3 --replication-factor 1
        echo "created stockviz.trades.v1 stockviz.market.v1 stockviz.news.v1 (3 partitions, RF=1)"

  # --- Application stack ---------------------------------------------------
  # Behind the "app" profile so `pnpm db:up` stays a fast Postgres-only start
  # for native development. `pnpm stack:up` brings these up as well.
  #
  # Build context is the repository root for both images: the web Dockerfile
  # needs the pnpm workspace, and the api Dockerfile is given apps/api.

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: stockviz-api:local
    container_name: stockviz-api
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network Postgres is on its own hostname and the
      # container port (5432), not the 5434 the host publishes.
      DATABASE_URL: postgresql+psycopg://stockviz:stockviz_dev@postgres:5432/stockviz
      # From infra/.env — see infra/.env.example. Must match the web service.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env (see infra/.env.example)}
      PORT: "8000"
      ENVIRONMENT: development
      ENABLE_SCHEDULER: "false"
      CORS_ORIGINS: '["http://localhost:3100"]'
    ports:
      - "8000:8000"
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the browser bundle at build time, so it must be a URL
        # the laptop can reach — not the compose hostname.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: stockviz-web:local
    container_name: stockviz-web
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      # Server-side fetches go over the compose network; the browser bundle
      # uses NEXT_PUBLIC_API_URL from the build arg above.
      API_URL: http://api:8000
      DATABASE_URL: postgres://stockviz:stockviz_dev@postgres:5432/stockviz
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env (see infra/.env.example)}
      # The web image is a production build, and lib/env.ts refuses the dev
      # defaults committed to this repo when NODE_ENV=production.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in infra/.env (see infra/.env.example)}
      # Production builds outside Vercel don't trust the request host by
      # default; without this every auth callback 500s.
      AUTH_TRUST_HOST: "true"
    ports:
      # 3000 is commonly taken by another local project, so publish 3100.
      # AUTH_URL stays unset, so NextAuth derives the origin from the request.
      - "3100:3000"

volumes:
  postgres_data:
    name: stockviz_postgres_data
