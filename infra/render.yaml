# Render Blueprint for StockViz API.
#
# Usage:
#   - In the Render dashboard, "New +" -> "Blueprint" and point at this repo.
#   - Render reads this file, provisions the database, and creates the web
#     service. Secrets (alpha_vantage_key, newsdata_key, sentry_dsn,
#     nextauth_jwt_secret, internal_api_token) must be set after creation —
#     `sync: false` keeps Render from overwriting them.
#
# The Next.js frontend deploys separately on Vercel; see apps/web/vercel.json.

databases:
  - name: stockviz-postgres
    databaseName: stockviz
    user: stockviz
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: stockviz-api
    runtime: docker
    repo: https://github.com/MananJariwala/stock-viz-simulator
    branch: main
    rootDir: apps/api
    dockerfilePath: apps/api/Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: stockviz-postgres
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # set to your Vercel URL after first deploy
      - key: NEXTAUTH_JWT_SECRET
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: NEWSDATA_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Safety net: even if the in-process APScheduler dies, this nightly cron
  # re-runs the price ingest. Recommendations get rebuilt on the same schedule
  # so the homepage and /recommendations page never go stale for more than 24h.
  - type: cron
    name: stockviz-nightly-refresh
    runtime: docker
    repo: https://github.com/MananJariwala/stock-viz-simulator
    branch: main
    rootDir: apps/api
    dockerfilePath: apps/api/Dockerfile
    plan: free
    schedule: "30 21 * * 1-5" # 21:30 UTC = 16:30 ET, weekdays
    dockerCommand: sh -c "python -m stockviz.cli ingest AAPL MSFT GOOGL AMZN META TSLA NVDA JPM V WMT && python -m stockviz.cli recommend"
    envVars:
      - fromGroup: stockviz-shared
      - key: DATABASE_URL
        fromDatabase:
          name: stockviz-postgres
          property: connectionString

envVarGroups:
  - name: stockviz-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
