apiVersion: v1
kind: Secret
metadata:
  name: stockviz-secrets
  namespace: stockviz
  labels:
    app.kubernetes.io/name: stockviz
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: stockviz
    app.kubernetes.io/version: 2.0.0
  annotations:
    stockviz.io/scope: kind-dev-only
    stockviz.io/warning: Dummy local credentials. Never use in production.
type: Opaque
stringData:
  POSTGRES_PASSWORD: stockviz-kind-only
  DATABASE_URL: postgresql://stockviz:stockviz-kind-only@postgres:5432/stockviz
  INTERNAL_API_TOKEN: kind-dev-internal-token-not-for-production
  AUTH_SECRET: kind-dev-auth-secret-not-for-production
  ALPHA_VANTAGE_KEY: ''
  NEWSDATA_KEY: ''
  ANTHROPIC_API_KEY: ''
