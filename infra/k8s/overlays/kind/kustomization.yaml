apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres.yaml
  - postgres-service.yaml
  - secret.yaml
patches:
  # Never pull local StockViz images. Do not apply this to postgres:16-alpine.
  - target:
      kind: Deployment
      name: stockviz-.*
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Job
      name: stockviz-migrate
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
images:
  - name: stockviz-api
    newName: stockviz-api
    newTag: dev
  - name: stockviz-web
    newName: stockviz-web
    newTag: dev
