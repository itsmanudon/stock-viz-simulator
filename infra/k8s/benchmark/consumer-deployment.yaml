apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockviz-benchmark-consumer
  namespace: stockviz
  labels:
    app.kubernetes.io/name: stockviz
    app.kubernetes.io/component: benchmark-consumer
    app.kubernetes.io/part-of: stockviz
    app.kubernetes.io/version: 2.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockviz
      app.kubernetes.io/component: benchmark-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockviz
        app.kubernetes.io/component: benchmark-consumer
        app.kubernetes.io/part-of: stockviz
        app.kubernetes.io/version: 2.0.0
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: consumer
        image: stockviz-api:dev
        imagePullPolicy: Never
        command:
        - python
        - -m
        - stockviz.benchmarks.kafka_scaling
        - consume
        - --group
        - stockviz.benchmark.manual
        - --run-id
        - none
        - --expect
        - "0"
        - --max-idle
        - '60'
        envFrom:
        - configMapRef:
            name: stockviz-config
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
