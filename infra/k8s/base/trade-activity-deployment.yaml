apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockviz-trade-activity
  namespace: stockviz
  labels:
    app.kubernetes.io/name: stockviz
    app.kubernetes.io/component: trade-activity
    app.kubernetes.io/part-of: stockviz
    app.kubernetes.io/version: 2.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockviz
      app.kubernetes.io/component: trade-activity
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockviz
        app.kubernetes.io/component: trade-activity
        app.kubernetes.io/part-of: stockviz
        app.kubernetes.io/version: 2.0.0
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: stockviz-api:dev
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - stockviz.workers.trade_activity_consumer
        envFrom:
        - configMapRef:
            name: stockviz-config
        - secretRef:
            name: stockviz-secrets
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
