apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockviz-outbox-publisher
  namespace: stockviz
  labels:
    app.kubernetes.io/name: stockviz
    app.kubernetes.io/component: outbox-publisher
    app.kubernetes.io/part-of: stockviz
    app.kubernetes.io/version: 2.0.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockviz
      app.kubernetes.io/component: outbox-publisher
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockviz
        app.kubernetes.io/component: outbox-publisher
        app.kubernetes.io/part-of: stockviz
        app.kubernetes.io/version: 2.0.0
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: stockviz-api:dev
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - stockviz.workers.outbox_publisher
        envFrom:
        - configMapRef:
            name: stockviz-config
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stockviz-db
              key: DATABASE_URL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
