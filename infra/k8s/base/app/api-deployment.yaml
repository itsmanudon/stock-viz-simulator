apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockviz-api
  namespace: stockviz
  labels:
    app.kubernetes.io/name: stockviz
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: stockviz
    app.kubernetes.io/version: 2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stockviz
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockviz
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: stockviz
        app.kubernetes.io/version: 2.0.0
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: stockviz-api:dev
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        - stockviz.main:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --proxy-headers
        - --forwarded-allow-ips
        - '*'
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: ENABLE_SCHEDULER
          value: 'false'
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: stockviz-db
              key: DATABASE_URL
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: stockviz-auth
              key: INTERNAL_API_TOKEN
        envFrom:
        - configMapRef:
            name: stockviz-config
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 750m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
