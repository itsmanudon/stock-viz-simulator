apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: stockviz
  labels:
    strimzi.io/cluster: stockviz
    app.kubernetes.io/name: stockviz
    app.kubernetes.io/component: kafka
    app.kubernetes.io/part-of: stockviz
    app.kubernetes.io/version: 2.0.0
spec:
  replicas: 1
  roles:
  - controller
  - broker
  storage:
    type: ephemeral
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  jvmOptions:
    -Xms: 256m
    -Xmx: 256m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: stockviz
  namespace: stockviz
  labels:
    app.kubernetes.io/name: stockviz
    app.kubernetes.io/component: kafka
    app.kubernetes.io/part-of: stockviz
    app.kubernetes.io/version: 2.0.0
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: '3.9'
    listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
