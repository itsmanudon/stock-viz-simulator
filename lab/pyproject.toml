[project]
name = "stockviz-lab"
version = "0.1.0"
description = "StockViz research node: a DuckDB catalogue over the hot database's Parquet export (laptop only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.1",
    "polars==2.2.0",
    "pyarrow==26.0.1",
]

[project.scripts]
lab = "stockviz_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockviz_lab"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.16.4",
]

# Mirrors apps/api's ruff settings.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
